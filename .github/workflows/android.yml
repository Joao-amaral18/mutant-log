name: Android CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # Robolectric with SDK 36 needs JDK 21 (see AGENTS.md).
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # The runner image ships the Android SDK; AGP installs missing platforms once licenses are accepted.
      - name: Accept Android SDK licenses
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v5

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew testDebugUnitTest --stacktrace 2>&1 | tee gradle-test.log

      - name: Debug build
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee gradle-build.log

      # Turn compiler errors and failing tests into annotations so they show on the PR.
      - name: Report build errors
        if: failure()
        run: |
          cat gradle-*.log 2>/dev/null | grep -E "^e: |^> Task .* FAILED|What went wrong|^[A-Za-z]+Test > .* FAILED" -A2 | head -60 > errors.txt || true
          while IFS= read -r line; do echo "::error::${line}"; done < <(grep -E "^e: |FAILED|What went wrong" errors.txt | head -40)
          { echo '## Build errors'; echo '```'; cat errors.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      # Screenshots captured by the Robolectric UI tests (build/test-artifacts/*.png).
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ui-screenshots
          path: app/build/test-artifacts/
          if-no-files-found: ignore

      - name: Upload debug APK
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: ignore
